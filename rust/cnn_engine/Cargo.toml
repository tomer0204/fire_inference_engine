[package]
name = "yolo_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.141"
serde_yaml = "0.9.34"
tokio = { version = "1.47.0", features = ["full"] }
image = "0.25.6"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
bytes = "1"
[features]
default = []
triton = ["dep:triton-client"]

[dependencies.triton-client]
version = "0.2.0"
optional = true
